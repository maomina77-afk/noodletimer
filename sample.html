<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>JANコード商品名検索（CORS回避対策版）</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        .container { max-width: 600px; margin: auto; }
        input, button { padding: 8px; font-size: 16px; }
        #result { margin-top: 15px; font-weight: bold; color: #333; }
        .note { font-size: 12px; color: #666; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>商品検索アプリ（CORS対策済）</h1>
        <p>JANコードを入力してください:</p>
        <input type="text" id="janInput" placeholder="例: 4901330011332">
        <button onclick="searchItem()">検索</button>
        
        <h2>検索結果:</h2>
        <p id="result">ここに商品名が表示されます</p>

        <p class="note">※CORS制限を回避するため、CORSプロキシを経由してAPIにアクセスしています。</p>
    </div>

    <script>
        async function searchItem() {
            const clientId = 'dmVyPTIwMjUwNyZpZD1VUXFzQkpCSllzJmhhc2g9TlRaa1l6SXlNemMyTUdRek5qUmtNdw'; 
            const jan = document.getElementById('janInput').value.trim();
            const resultEl = document.getElementById('result');

            if (!jan) {
                resultEl.textContent = 'JANコードを入力してください。';
                return;
            }

            // 1. 本来のYahoo!ショッピングAPIのURL
            const targetUrl = `https://shopping.yahooapis.jp/ShoppingWebService/V3/itemSearch?appid=${clientId}&jan_code=${jan}`;

            // 2. CORSプロキシのURLでラップする（ブラウザのCORS制限を回避）
            // ※corsproxy.ioなどのサービスを経由することで、ブラウザから安全に外部APIへアクセスできます
            const proxyUrl = `https://corsproxy.io/?` + encodeURIComponent(targetUrl);

            resultEl.textContent = '検索中...';

            try {
                const response = await fetch(proxyUrl);
                
                if (!response.ok) {
                    throw new Error(`サーバーエラー (HTTP Status: ${response.status})`);
                }

                const data = await response.json();

                if (data.hits && data.hits.length > 0) {
                    const itemName = data.hits[0].name;
                    resultEl.textContent = itemName;
                } else {
                    resultEl.textContent = '商品が見つかりませんでした。';
                }
            } catch (error) {
                console.error(error);
                resultEl.textContent = 'エラーが発生しました: ' + error.message;
            }
        }
    </script>
</body>
</html>
