<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Noodle Timer V1.02</title>
    <!-- バーコードスキャン用のライブラリ -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1e1e1e; color: #d4d4d4; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; }
        * { box-sizing: border-box; }
        
        .header { background-color: #252526; width: 100%; padding: 15px; text-align: center; font-size: 1.2em; font-weight: bold; border-bottom: 1px solid #3e3e42; color: #fff; }
        
        .container { padding: 20px; width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 20px; }
        .panel { background-color: #2d2d2d; border: 1px solid #3e3e42; border-radius: 8px; padding: 20px; text-align: center; }
        
        button { background-color: #0e639c; color: white; border: none; padding: 15px 20px; border-radius: 6px; font-size: 1.1em; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
        button:active { background-color: #1177bb; }
        button:disabled { background-color: #555; cursor: not-allowed; color: #888; }
        .btn-start-timer { background-color: #28a745; }
        .btn-stop { background-color: #dc3545; }
        .btn-quick { background-color: #d1691c; width: auto; padding: 10px 20px; flex-grow: 1; }
        
        .btn-import-label { display: block; background-color: #512da8; color: white; padding: 15px 20px; border-radius: 6px; font-size: 1.1em; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; text-align: center; }
        .btn-import-label:active { background-color: #4527a0; }
        
        #reader { width: 100%; border-radius: 8px; overflow: hidden; }
        #reader video { object-fit: cover; }
        
        .noodle-info { font-size: 1.5em; color: #dcdcaa; font-weight: bold; margin: 15px 0; }
        .time-info { font-size: 1.2em; color: #fff; }
        
        .timer-display { font-size: 6em; font-weight: bold; color: #4fc1ff; text-align: center; line-height: 1; margin: 20px 0; font-family: monospace; }
        .status-msg { font-size: 1.1em; color: #ce9178; margin-top: 10px; }

        .register-form { margin-top: 20px; background-color: #333; padding: 15px; border-radius: 8px; border: 1px dashed #555; text-align: left; }
        
        /* 入力フォーム・プルダウンのスタイル */
        input[type="text"], input[type="number"], select { 
            width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 15px; 
            background-color: #1e1e1e; color: #fff; border: 1px solid #555; 
            border-radius: 4px; font-size: 1em; 
        }
        .time-input { width: 80px; text-align: right; margin-bottom: 0; font-size: 1.2em; }
    </style>
</head>
<body>

<div class="header">Noodle Timer V1.02</div>

<div class="container">
    <!-- 1. スキャン画面 -->
    <div class="panel" id="scanPanel">
        <h3 style="margin-top: 0; color: #569cd6;">📷 バーコードで探す</h3>
        <p style="font-size: 0.9em; color: #888;">商品のJANコードを読み取ります</p>
        <div id="reader"></div>
        <button id="btnStartScan">カメラを起動する</button>
        <button id="btnStopScan" class="btn-stop" style="display: none;">⏹ スキャン停止</button>
    </div>

    <!-- 2. リストから手動選択画面 -->
    <div class="panel" id="manualSelectPanel">
        <h3 style="margin-top: 0; color: #4ec9b0;">📋 リストから選ぶ</h3>
        <select id="makerSelect">
            <option value="">メーカーを選択...</option>
        </select>
        <select id="productSelect" disabled>
            <option value="">商品を選択...</option>
        </select>
        <button id="btnStartManualSelect" class="btn-start-timer" disabled>▶ タイマー開始</button>
    </div>

    <!-- 3. 手動タイマー画面 -->
    <div class="panel" id="manualTimerPanel">
        <h3 style="margin-top: 0; color: #ce9178;">⏱ 手動でセット</h3>
        <div style="display: flex; gap: 10px; justify-content: space-between; margin-bottom: 15px;">
            <button id="btn3Min" class="btn-quick">3分セット</button>
            <button id="btn5Min" class="btn-quick">5分セット</button>
        </div>
        <div style="display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 10px;">
            <input type="number" id="manualMin" class="time-input" value="3" min="0" max="99"> 分
            <input type="number" id="manualSec" class="time-input" value="0" min="0" max="59"> 秒
        </div>
        <button id="btnStartManualTimer" class="btn-start-timer">▶ タイマー開始</button>
    </div>

    <!-- データ管理画面 -->
    <div class="panel" id="dataPanel">
        <h3 style="margin-top: 0; color: #4fc1ff;">💾 データ管理</h3>
        <p style="font-size: 0.9em; color: #888;">自分で登録したデータのバックアップ・復元</p>
        <button id="btnExport" style="background-color: #28a745;">📤 データを書き出し (保存)</button>
        <label for="fileImport" class="btn-import-label">📥 データを読み込み (復元)</label>
        <input type="file" id="fileImport" accept=".json" style="display: none;">
    </div>

    <!-- 結果・カウントダウン画面 -->
    <div class="panel" id="timerPanel" style="display: none;">
        <!-- スキャン結果確認用 -->
        <div id="resultArea">
            <div class="noodle-info" id="noodleName">商品名</div>
            <div class="time-info" id="timeInfoWrapper">待ち時間: <span id="noodleTime">--</span></div>
            <div class="status-msg" id="statusMessage"></div>
            
            <button id="btnStartTimerFromScan" class="btn-start-timer" style="display: none;">▶ タイマー開始</button>

            <!-- 新規登録フォーム（Yahoo! API連携対応） -->
            <div id="registerArea" class="register-form" style="display: none;">
                <h4 style="margin: 0 0 10px 0; color: #4fc1ff;">📝 新しい商品を登録</h4>
                
                <div style="margin-bottom: 10px;">
                    <label style="font-size: 0.85em; color: #888;">Yahoo! API アプリケーションID (Client ID)</label>
                    <input type="text" id="yahooAppId" placeholder="ここにYahoo! APIのClient IDを入力" style="margin-bottom: 5px;">
                    <button id="btnFetchYahoo" style="background-color: #512da8; padding: 10px; font-size: 0.9em; margin-top: 0;">🔍 Yahoo! APIで商品情報を検索</button>
                </div>

                <label style="font-size: 0.9em;">メーカー名 / 商品名</label>
                <input type="text" id="regName" placeholder="例: 日清食品 カップヌードル">
                
                <label style="font-size: 0.9em; display: block; margin-top: 5px;">分類（ジャンル）</label>
                <input type="text" id="regGenre" placeholder="例: カップラーメン">

                <label style="font-size: 0.9em; display: block; margin-top: 5px;">待ち時間を選択して登録</label>
                <div style="display: flex; gap: 10px; margin: 5px 0 15px 0;">
                    <button type="button" class="btn-reg-time-preset" data-min="3" style="margin-top:0; background-color:#d1691c; padding:8px;">3分</button>
                    <button type="button" class="btn-reg-time-preset" data-min="4" style="margin-top:0; background-color:#555; padding:8px;">4分</button>
                    <button type="button" class="btn-reg-time-preset" data-min="5" style="margin-top:0; background-color:#555; padding:8px;">5分</button>
                </div>

                <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 15px;">
                    <input type="number" id="regTime" value="3" min="1" max="15" class="time-input">
                    <span>分 (カスタム指定)</span>
                </div>
                <button id="btnRegisterAndStart" style="background-color: #d1691c;">💾 登録してタイマー開始</button>
            </div>
            <button id="btnRetryScan" style="background-color: #555;">🔄 キャンセル</button>
        </div>

        <!-- 実際のカウントダウンタイマー -->
        <div id="countdownArea" style="display: none;">
            <div id="countdownLabel" class="noodle-info"></div>
            <div class="timer-display" id="timerDisplay">00:00</div>
            <button id="btnCancelTimer" class="btn-stop">■ 中止して戻る</button>
        </div>
    </div>
</div>

<script>
    // === 1. 基本データベース ===
    const DEFAULT_DB = {
        "4902881073604": { name: "チャルメラカップ しょうゆ", seconds: 180 }, 
        "4902702004002": { name: "マルタイ 長崎ちゃんぽん", seconds: 180 }, 
        "4902885000686": { name: "ペヤング ソースやきそば", seconds: 180 }, 
        "4902885001454": { name: "ペヤング ソースやきそば 超大盛", seconds: 180 }, 
        "4902105022122": { name: "日清焼そばU.F.O.", seconds: 180 }, 
        "4902105032633": { name: "日清のどん兵衛 きつねうどん(東)", seconds: 300 }, 
        "4902105282670": { name: "日清のどん兵衛 肉うどん", seconds: 300 }, 
        "4902105273760": { name: "U.F.O醤油まぜそば 濃い濃いラー油マヨ付き", seconds: 300 }, 
        "4902105280461": { name: "日清ラ王 背脂醤油",seconds: 300  },
        "4902105280478": { name: "日清ラ王 とろ熟味噌",seconds: 300  },
        "4902105280485": { name: "日清ラ王 とろまろ塩",seconds: 300  },
        "4902105273012": { name: "日清ラ王焙煎ごま坦々",seconds: 300  },
        "4902885004004": { name: "ペヤング 激辛やきそば",seconds: 180  },
    };

    let userDB = JSON.parse(localStorage.getItem('cup_noodle_custom_db')) || {};
    let activeDB = { ...DEFAULT_DB, ...userDB };

    // APIキーの永続化
    const savedAppId = localStorage.getItem('yahoo_app_id') || "";
    document.getElementById('yahooAppId').value = savedAppId;
    document.getElementById('yahooAppId').addEventListener('input', (e) => {
        localStorage.setItem('yahoo_app_id', e.target.value.trim());
    });

    // === 音声・UI・状態管理 ===
    let audioContext;
    function playBeep() {
        if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
        if (audioContext.state === 'suspended') audioContext.resume();
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        osc.connect(gain);
        gain.connect(audioContext.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, audioContext.currentTime); 
        gain.gain.setValueAtTime(1.0, audioContext.currentTime);     
        gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 1.5); 
        osc.start(audioContext.currentTime);
        osc.stop(audioContext.currentTime + 1.5);
    }

    const scanPanel = document.getElementById('scanPanel');
    const manualSelectPanel = document.getElementById('manualSelectPanel');
    const manualTimerPanel = document.getElementById('manualTimerPanel');
    const dataPanel = document.getElementById('dataPanel');
    const timerPanel = document.getElementById('timerPanel');
    const resultArea = document.getElementById('resultArea');
    const countdownArea = document.getElementById('countdownArea');
    
    let html5QrCode;
    let targetSeconds = 0;
    let currentInterval = null;
    let isCameraRunning = false; 
    let currentBarcode = "";

    // === 2. リスト選択機能の初期化 ===
    const makerSelect = document.getElementById('makerSelect');
    const productSelect = document.getElementById('productSelect');
    let groupedDB = {};

    function getMakerName(productName) {
        if (productName.includes("日清")) return "日清食品";
        if (productName.includes("マルちゃん") || productName.includes("ごつ盛り")) return "東洋水産 (マルちゃん)";
        if (productName.includes("ペヤング")) return "まるか食品 (ペヤング)";
        if (productName.includes("明星") || productName.includes("一平ちゃん") || productName.includes("チャルメラ")) return "明星食品";
        if (productName.includes("スーパーカップ") || productName.includes("わかめラーメン")) return "エースコック";
        if (productName.includes("サッポロ一番") || productName.includes("カップスター")) return "サンヨー食品";
        return "その他 (独自登録など)";
    }

    function initSelectBoxes() {
        groupedDB = {};
        for (const key in activeDB) {
            const item = activeDB[key];
            const maker = getMakerName(item.name);
            if (!groupedDB[maker]) groupedDB[maker] = [];
            groupedDB[maker].push({ id: key, name: item.name, seconds: item.seconds });
        }
        
        makerSelect.innerHTML = '<option value="">メーカーを選択...</option>';
        productSelect.innerHTML = '<option value="">商品を選択...</option>';
        productSelect.disabled = true;
        document.getElementById('btnStartManualSelect').disabled = true;

        for (const maker in groupedDB) {
            const opt = document.createElement('option');
            opt.value = maker;
            opt.textContent = maker;
            makerSelect.appendChild(opt);
        }
    }
    
    makerSelect.addEventListener('change', (e) => {
        const maker = e.target.value;
        productSelect.innerHTML = '<option value="">商品を選択...</option>';
        if (maker && groupedDB[maker]) {
            groupedDB[maker].forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.id; 
                opt.textContent = `${p.name} (${p.seconds / 60}分)`;
                productSelect.appendChild(opt);
            });
            productSelect.disabled = false;
        } else {
            productSelect.disabled = true;
        }
        document.getElementById('btnStartManualSelect').disabled = true;
    });

    productSelect.addEventListener('change', (e) => {
        document.getElementById('btnStartManualSelect').disabled = !e.target.value;
    });

    document.getElementById('btnStartManualSelect').addEventListener('click', () => {
        const barcode = productSelect.value;
        const item = activeDB[barcode];
        if (item) {
            targetSeconds = item.seconds;
            startCountdownMode(item.name);
        }
    });

    // === 3. 手動タイマー機能 ===
    document.getElementById('btn3Min').addEventListener('click', () => {
        document.getElementById('manualMin').value = 3;
        document.getElementById('manualSec').value = 0;
    });

    document.getElementById('btn5Min').addEventListener('click', () => {
        document.getElementById('manualMin').value = 5;
        document.getElementById('manualSec').value = 0;
    });

    document.getElementById('btnStartManualTimer').addEventListener('click', () => {
        const m = parseInt(document.getElementById('manualMin').value) || 0;
        const s = parseInt(document.getElementById('manualSec').value) || 0;
        const total = (m * 60) + s;
        if (total > 0) {
            targetSeconds = total;
            let label = m > 0 ? `${m}分` : "";
            label += s > 0 ? `${s}秒` : "";
            startCountdownMode(`手動設定 (${label})`);
        } else {
            alert("1秒以上の時間を設定してください");
        }
    });

    // === 4. バーコードスキャン処理 & Yahoo! API連携 ===
    document.getElementById('btnStartScan').addEventListener('click', () => {
        if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");
        document.getElementById('btnStartScan').style.display = 'none';
        document.getElementById('btnStopScan').style.display = 'block';

        html5QrCode.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: { width: 250, height: 100 } },
            (decodedText) => {
                stopScanner();
                processBarcode(decodedText);
            },
            () => {}
        ).then(() => { isCameraRunning = true; })
         .catch((err) => {
            alert("カメラ起動失敗\n" + err);
            document.getElementById('btnStartScan').style.display = 'block';
            document.getElementById('btnStopScan').style.display = 'none';
            isCameraRunning = false;
        });
    });

    document.getElementById('btnStopScan').addEventListener('click', stopScanner);

    function stopScanner() {
        if (html5QrCode && isCameraRunning) {
            html5QrCode.stop().then(() => {
                html5QrCode.clear();
                isCameraRunning = false;
                document.getElementById('btnStartScan').style.display = 'block';
                document.getElementById('btnStopScan').style.display = 'none';
            }).catch(() => { isCameraRunning = false; });
        }
    }

    function processBarcode(barcode) {
        hideHomePanels();
        timerPanel.style.display = 'block';
        resultArea.style.display = 'block';
        countdownArea.style.display = 'none';
        currentBarcode = barcode;

        const item = activeDB[barcode];
        if (item) {
            document.getElementById('noodleName').textContent = item.name;
            document.getElementById('noodleTime').textContent = (item.seconds / 60) + "分";
            document.getElementById('statusMessage').textContent = "読取成功: " + barcode;
            document.getElementById('statusMessage').style.color = "#ce9178";
            
            targetSeconds = item.seconds;
            document.getElementById('btnStartTimerFromScan').style.display = 'block';
            document.getElementById('registerArea').style.display = 'none';
            document.getElementById('timeInfoWrapper').style.display = 'block';
        } else {
            document.getElementById('noodleName').textContent = "未登録の商品";
            document.getElementById('statusMessage').textContent = "バーコード: " + barcode;
            document.getElementById('statusMessage').style.color = "#dc3545";
            
            document.getElementById('btnStartTimerFromScan').style.display = 'none';
            document.getElementById('registerArea').style.display = 'block';
            document.getElementById('timeInfoWrapper').style.display = 'none';
            
            document.getElementById('regName').value = "";
            document.getElementById('regGenre').value = "";
            document.getElementById('regTime').value = "3";
        }
    }

    // Yahoo! API (v3 itemSearch) を使ったJANコード検索
    document.getElementById('btnFetchYahoo').addEventListener('click', async () => {
        const appId = document.getElementById('yahooAppId').value.trim();
        if (!appId) {
            alert("Yahoo! APIのClient ID（アプリケーションID）を入力してください。");
            return;
        }

        const btn = document.getElementById('btnFetchYahoo');
        btn.disabled = true;
        btn.textContent = "検索中...";

        // CORS回避のため、一般的な公開プロキシまたはJSONP代替として直接fetch（※環境によってはCORSエラーになるため必要に応じてCORS拡張やサーバー経由へ変更してください）
        const apiUrl = `https://shopping.yahooapis.jp/ShoppingWebService/V3/itemSearch?appid=${appId}&jan_code=${currentBarcode}`;

        try {
            // ブラウザの制約(CORS)を考慮し、CORS非対応の場合は通常エラーになります
            const response = await fetch(apiUrl);
            if (!response.ok) throw new Error("API通信に失敗しました (HTTP " + response.status + ")");
            
            const data = await response.json();
            if (data.totalResultsReturned > 0 && data.hits && data.hits.length > 0) {
                const hit = data.hits[0];
                const brandName = hit.brand ? hit.brand.name : "";
                const productName = hit.name || "";
                const genreName = hit.genreCategory ? hit.genreCategory.name : "";

                document.getElementById('regName').value = (brandName ? brandName + " " : "") + productName;
                document.getElementById('regGenre').value = genreName;
                alert("Yahoo!ショッピングから商品情報を取得しました！");
            } else {
                alert("Yahoo!ショッピングに該当するJANコードのデータが見つかりませんでした。手動で入力してください。");
            }
        } catch (err) {
            console.error(err);
            alert("APIの取得に失敗しました。ブラウザのCORS制限等により直接呼び出せない場合があります。\nエラー詳細: " + err.message);
        } finally {
            btn.disabled = false;
            btn.textContent = "🔍 Yahoo! APIで商品情報を検索";
        }
    });

    // 登録画面の待ち時間プリセットボタン
    document.querySelectorAll('.btn-reg-time-preset').forEach(btn => {
        btn.addEventListener('click', (e) => {
            document.querySelectorAll('.btn-reg-time-preset').forEach(b => b.style.backgroundColor = '#555');
            e.target.style.backgroundColor = '#d1691c';
            document.getElementById('regTime').value = e.target.getAttribute('data-min');
        });
    });

    // スキャンからのタイマー開始
    document.getElementById('btnStartTimerFromScan').addEventListener('click', () => {
        startCountdownMode(activeDB[currentBarcode].name);
    });

    // 新規登録からのタイマー開始
    document.getElementById('btnRegisterAndStart').addEventListener('click', () => {
        const nameInput = document.getElementById('regName').value.trim();
        const timeInput = parseInt(document.getElementById('regTime').value);

        if (nameInput === "") return alert("商品名を入力してください。");
        if (isNaN(timeInput) || timeInput <= 0) return alert("正しい待ち時間を入力してください。");

        const newSeconds = timeInput * 60;
        userDB[currentBarcode] = { name: nameInput, seconds: newSeconds };
        localStorage.setItem('cup_noodle_custom_db', JSON.stringify(userDB));
        activeDB[currentBarcode] = { name: nameInput, seconds: newSeconds };
        
        targetSeconds = newSeconds;
        startCountdownName = nameInput;
        startCountdownMode(nameInput);
    });

    // === 5. タイマーの共通処理 ===
    function hideHomePanels() {
        scanPanel.style.display = 'none';
        manualSelectPanel.style.display = 'none';
        manualTimerPanel.style.display = 'none';
        dataPanel.style.display = 'none';
    }

    function startCountdownMode(labelName) {
        if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
        if (audioContext.state === 'suspended') audioContext.resume();

        hideHomePanels();
        timerPanel.style.display = 'block';
        resultArea.style.display = 'none';
        countdownArea.style.display = 'block';
        document.getElementById('countdownLabel').textContent = labelName;

        updateTimerDisplay(targetSeconds);
        let remain = targetSeconds;
        
        currentInterval = setInterval(() => {
            remain--;
            updateTimerDisplay(remain);
            if (remain <= 0) {
                clearInterval(currentInterval);
                document.getElementById('timerDisplay').textContent = "完成！";
                playBeep(); 
            }
        }, 1000);
    }

    function updateTimerDisplay(sec) {
        if (sec < 0) sec = 0;
        const m = Math.floor(sec / 60);
        const s = sec % 60;
        document.getElementById('timerDisplay').textContent = 
            String(m).padStart(2, '0') + ":" + String(s).padStart(2, '0');
    }

    // 中止・戻る処理
    document.getElementById('btnCancelTimer').addEventListener('click', resetApp);
    document.getElementById('btnRetryScan').addEventListener('click', resetApp);

    function resetApp() {
        if (currentInterval) clearInterval(currentInterval);
        timerPanel.style.display = 'none';
        scanPanel.style.display = 'block';
        manualSelectPanel.style.display = 'block';
        manualTimerPanel.style.display = 'block';
        dataPanel.style.display = 'block';
        initSelectBoxes(); 
    }

    // === 6. データのバックアップ/復元 ===
    document.getElementById('btnExport').addEventListener('click', () => {
        if (Object.keys(userDB).length === 0) return alert("自分で登録したデータがまだありません。");
        const blob = new Blob([JSON.stringify(userDB, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = "cup_noodle_custom_db.json";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    });

    document.getElementById('fileImport').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
            try {
                const importedDB = JSON.parse(event.target.result);
                userDB = { ...userDB, ...importedDB };
                localStorage.setItem('cup_noodle_custom_db', JSON.stringify(userDB));
                activeDB = { ...DEFAULT_DB, ...userDB };
                initSelectBoxes();
                alert("データの読み込みに成功しました！\n登録商品数: " + Object.keys(userDB).length + "件");
            } catch (err) {
                alert("ファイルの読み込みに失敗しました。");
            }
            e.target.value = '';
        };
        reader.readAsText(file);
    });

    // アプリ起動時の初期化
    initSelectBoxes();
</script>
</body>
</html>
